# HuGR_Datarail — cargo workspace. Crate DAG per docs/design/00-CONSTITUTION.md.
[workspace]
resolver = "2"
members = [
    "crates/datarail-core",
    "crates/datarail-crypto",
    "crates/datarail-cofre",
    "crates/datarail-manifest",
    "crates/datarail-once",
    "crates/datarail-rail",
    "crates/datarail-substrate-objectstore",
    "crates/datarail-substrate-wal",
    "crates/datarail-erasure",
    "crates/datarail-replaylog",
    "crates/datarail-keyrouter",
    "crates/datarail-topic",
    "crates/datarail-blobstore",
    "crates/datarail-offsets",
    "crates/datarail-replication",
    "crates/datarail-broker",
    "crates/datarail-replicated-topic",
    "crates/datarail-netblob",
    "crates/datarail-system",
    "crates/datarail-fuzz",
    "crates/datarail-tieredlog",
    "crates/datarail-substrate-quic",
    "crates/datarail-substrate-shmem",
    "crates/datarail-terminal",
    "crates/datarail-connectors",
    "crates/datarail-spec",
    "crates/datarail-cli",
    "crates/datarail-identity",
    "crates/datarail-acceptance",
    "crates/datarail-bench",
    "crates/datarail-stress",
    "crates/datarail-metrics",
    "crates/datarail-omb-shim",
    "crates/datarail-kafka",
    "crates/datarail-keymgmt",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/HumanGuardrail/HuGR_Datarail"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
