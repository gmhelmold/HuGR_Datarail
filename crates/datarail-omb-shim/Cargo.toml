[package]
name = "datarail-omb-shim"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "datarail-omb-shim — a mini-broker on datarail's real sealed terminals so the OpenMessaging Benchmark can drive datarail (see docs/design/OMB-PROTOCOL.md). Benchmark adapter, NOT a product component."

[[bin]]
name = "datarail-omb-shim"
path = "src/main.rs"

# An efficient native load generator that drives the shim over TCP with minimal per-message overhead (bulk
# send/recv, no per-message future or latency histogram). Its purpose: measure datarail's TRUE sealed
# throughput ceiling, which the OMB Java client provably could not saturate (3 shim optimizations moved the
# OMB number 0%). NOT a product component — a measurement tool, like the rest of this adapter crate.
[[bin]]
name = "datarail-loadgen"
path = "src/bin/loadgen.rs"

# datarail's pure sealed-engine throughput (board→offload in N threads, no sockets/driver) — the real ceiling.
[[bin]]
name = "datarail-engine-bench"
path = "src/bin/engine_bench.rs"

# Proves durability decouples from RAM: store N sealed cofres on disk, show process RSS stays flat as the
# on-disk store grows into the GBs (cheap/abundant disk vs scarce/expensive RAM).
[[bin]]
name = "datarail-store-bench"
path = "src/bin/store_bench.rs"

[lints]
workspace = true

[features]
# Route the sealed path through datarail's VAES AES-256-GCM backend (the "warp" seal path) instead of the
# default portable GCM-SIV. Forwarded to datarail-crypto. See build_terminal_config.
vaes = ["datarail-crypto/vaes"]

[dependencies]
datarail-core = { path = "../datarail-core" }
datarail-crypto = { path = "../datarail-crypto" }
datarail-rail = { path = "../datarail-rail" }
datarail-substrate-shmem = { path = "../datarail-substrate-shmem" }
datarail-substrate-objectstore = { path = "../datarail-substrate-objectstore" }
datarail-substrate-wal = { path = "../datarail-substrate-wal" }
datarail-terminal = { path = "../datarail-terminal" }

# tokio is QUARANTINED to this benchmark adapter. The shim is NOT a product / core / sealed-path crate; the
# Charter *leveza* (zero-external-deps) rule binds those crates, not this OMB measurement harness. tokio is here
# only to run async socket I/O so each connection is a task (not an OS thread) — killing the thread-per-conn
# oversubscription that capped the old std-threaded shim at ~620 MB/s on a many-core box. The CPU-bound sealed
# datapath still runs on a dedicated OS thread per topic, never on a runtime worker.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
