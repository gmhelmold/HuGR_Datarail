[package]
name = "datarail-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "datarail-cli — the `datarail` binary (validate/keygen/run/verify/ticket), SPEC 09."

[[bin]]
name = "datarail"
path = "src/main.rs"

[lints]
workspace = true

[features]
# QUIC pulls quinn+tokio+ring (heavy); keep the default binary featherweight (G2), QUIC one flag away.
quic = ["dep:datarail-substrate-quic"]
# TLS on the Kafka hop (KAFKA-TLS-DESIGN.md): reuses rustls (already vetted + in Cargo.lock via the quic
# substrate). Kept behind a flag so the default binary stays dependency-light. WAIVER logged in BUILD_LOG.
tls = ["dep:rustls", "dep:rustls-pemfile"]
# Accept COMPRESSED Kafka producer batches (KAFKA-COMPRESSION-DESIGN.md) — forwards datarail-kafka's feature so the
# kafka-broker/kafka-ingest binary decompresses gzip/lz4/zstd/snappy. Off by default (the default binary stays light).
compression = ["datarail-kafka/compression"]

[dependencies]
datarail-core = { path = "../datarail-core", version = "0.1.0" }
datarail-crypto = { path = "../datarail-crypto", version = "0.1.0" }
datarail-cofre = { path = "../datarail-cofre", version = "0.1.0" }
datarail-manifest = { path = "../datarail-manifest", version = "0.1.0" }
datarail-rail = { path = "../datarail-rail", version = "0.1.0" }
datarail-terminal = { path = "../datarail-terminal", version = "0.1.0" }
datarail-spec = { path = "../datarail-spec", version = "0.1.0" }
datarail-connectors = { path = "../datarail-connectors", version = "0.1.0" }
datarail-kafka = { path = "../datarail-kafka", version = "0.1.0" }
datarail-replaylog = { path = "../datarail-replaylog", version = "0.1.0" }
datarail-offsets = { path = "../datarail-offsets", version = "0.1.0" }
datarail-identity = { path = "../datarail-identity", version = "0.1.0" }
datarail-substrate-shmem = { path = "../datarail-substrate-shmem", version = "0.1.0" }
datarail-substrate-objectstore = { path = "../datarail-substrate-objectstore", version = "0.1.0" }
datarail-substrate-quic = { path = "../datarail-substrate-quic", version = "0.1.0", optional = true }
# TLS termination on the Kafka hop (feature = "tls"). ring backend, consistent with the quic substrate.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
rustls-pemfile = { version = "2", optional = true }
