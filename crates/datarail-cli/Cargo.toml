[package]
name = "datarail-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "datarail-cli — the `datarail` binary (validate/keygen/run/verify/ticket), SPEC 09."

[[bin]]
name = "datarail"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["per_partition_locking"]
# QUIC pulls quinn+tokio+ring (heavy); keep the default binary featherweight (G2), QUIC one flag away.
quic = ["dep:datarail-substrate-quic"]
# TLS on the Kafka hop (KAFKA-TLS-DESIGN.md): reuses rustls (already vetted + in Cargo.lock via the quic
# substrate). Kept behind a flag so the default binary stays dependency-light. WAIVER logged in BUILD_LOG.
tls = ["dep:rustls", "dep:rustls-pemfile"]
# Accept COMPRESSED Kafka producer batches (KAFKA-COMPRESSION-DESIGN.md) — forwards datarail-kafka's feature so the
# kafka-broker/kafka-ingest binary decompresses gzip/lz4/zstd/snappy. Off by default (the default binary stays light).
compression = ["datarail-kafka/compression"]
# Use per-partition locks for broker operations. Disable with `--no-default-features` for rollback testing.
per_partition_locking = []
[dependencies]
datarail-core = { path = "../datarail-core" }
datarail-crypto = { path = "../datarail-crypto" }
datarail-cofre = { path = "../datarail-cofre" }
datarail-manifest = { path = "../datarail-manifest" }
datarail-rail = { path = "../datarail-rail" }
datarail-terminal = { path = "../datarail-terminal" }
datarail-spec = { path = "../datarail-spec" }
datarail-connectors = { path = "../datarail-connectors" }
datarail-kafka = { path = "../datarail-kafka" }
datarail-replaylog = { path = "../datarail-replaylog" }
datarail-offsets = { path = "../datarail-offsets" }
datarail-identity = { path = "../datarail-identity" }
datarail-substrate-shmem = { path = "../datarail-substrate-shmem" }
datarail-substrate-objectstore = { path = "../datarail-substrate-objectstore" }
datarail-substrate-quic = { path = "../datarail-substrate-quic", optional = true }
# TLS termination on the Kafka hop (feature = "tls"). ring backend, consistent with the quic substrate.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
rustls-pemfile = { version = "2", optional = true }
