[package]
name = "datarail-bench"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "datarail-bench — directional latency/throughput micro-benchmarks (NOT GATE-WARP)."

[[bin]]
name = "datarail-bench"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Forward to datarail-crypto's VAES backend (ring AES-256-GCM) so the bench measures line-rate sealing.
vaes = ["datarail-crypto/vaes"]

[dependencies]
datarail-core = { path = "../datarail-core" }
datarail-crypto = { path = "../datarail-crypto" }
datarail-cofre = { path = "../datarail-cofre" }
datarail-terminal = { path = "../datarail-terminal" }
datarail-rail = { path = "../datarail-rail" }
